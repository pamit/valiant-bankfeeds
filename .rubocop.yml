plugins:
  - rubocop-rspec

AllCops:
  NewCops: enable
  SuggestExtensions: false

Style/StringLiterals:
  EnforcedStyle: double_quotes

# String literals are frozen by default in Ruby 4.
Style/FrozenStringLiteralComment:
  Enabled: false

Style/Documentation:
  Enabled: false

Metrics/MethodLength:
  Max: 20

Metrics/AbcSize:
  Max: 25

RSpec/MultipleExpectations:
  Max: 4

RSpec/ExampleLength:
  Max: 12

Layout/LineLength:
  Max: 140
